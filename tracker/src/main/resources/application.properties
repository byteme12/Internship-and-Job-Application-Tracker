# ==== MongoDB connection ====
# Assumes a local MongoDB instance. Install/run one with:
#   docker run -d -p 27017:27017 --name tracker-mongo mongo
# or install MongoDB Community Server and run `mongod`.
spring.data.mongodb.uri=mongodb://localhost:27017/tracker_db

# ==== Server ====
server.port=8080

# ==== Jackson ====
spring.jackson.serialization.write-dates-as-timestamps=false
