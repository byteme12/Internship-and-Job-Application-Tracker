# ==== MySQL connection ====
# Update the DB name / username / password to match your local MySQL setup.
# Create the schema first: CREATE DATABASE tracker_db;
spring.datasource.url=jdbc:mysql://localhost:3306/tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
# 'update' auto-creates/updates tables from the entity classes - fine for a course project.
# Switch to 'validate' once the schema is stable if you want stricter behaviour.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==== Server ====
server.port=8080

# ==== Jackson ====
spring.jackson.serialization.write-dates-as-timestamps=false
